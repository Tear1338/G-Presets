name: One-time old release cleanup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/prune-old-releases.yml']
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'Tear1338/G-Presets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep v1.5.2 and delete the explicitly requested older releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = "https://api.github.com/repos/Tear1338/G-Presets"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(path, method="GET"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers, method=method), timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == "DELETE":
                      return None
                  raise
          keep = api("/releases/424959820")
          latest = api("/releases/latest")
          assert keep["tag_name"] == "v1.5.2" and latest["id"] == keep["id"], "Latest release changed; stop without deleting"
          assert any(asset["name"] == "GPresets-1.5.2.jar" and asset["size"] > 0 for asset in keep["assets"]), "Latest JAR missing; stop"
          targets = [{"id":424953251,"tag":"v1.5.1"},{"id":424950117,"tag":"v1.5.0"},{"id":424940986,"tag":"v1.4.9"},{"id":424939358,"tag":"v1.4.8"},{"id":424937078,"tag":"v1.4.7"},{"id":424934572,"tag":"v1.4.6"},{"id":424932613,"tag":"v1.4.5"},{"id":424927093,"tag":"v1.4.4"},{"id":424924164,"tag":"v1.4.3"},{"id":424920762,"tag":"v1.4.2"},{"id":424915238,"tag":"v1.4.1"},{"id":424912666,"tag":"v1.4.0"},{"id":424909071,"tag":"v1.4.0-rc4"},{"id":424905148,"tag":"v1.4.0-rc3"},{"id":424901043,"tag":"v1.4.0-rc2"}]
          for target in targets:
              assert target["id"] != keep["id"] and target["tag"] != keep["tag_name"]
              current = api("/releases/" + str(target["id"]))
              assert current["tag_name"] == target["tag"], "Release identity mismatch"
          for target in targets:
              print("Deleting old release " + target["tag"], flush=True)
              api("/releases/" + str(target["id"]), "DELETE")
          remaining = api("/releases?per_page=100")
          assert len(remaining) == 1 and remaining[0]["id"] == keep["id"], "Unexpected releases remain; inspect manually"
          print("Verified: only v1.5.2 remains. Git tags and repository history are unchanged.")
